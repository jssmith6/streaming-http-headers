[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamheaders"
version = "0.1.0"
description = "Parse HTTP header blocks from a stream without buffering the whole request"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "jssmith6"}]

[tool.setuptools.packages.find]
where = ["src"]
